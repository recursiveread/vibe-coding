<!DOCTYPE html>
<!--
  Signature Pad
  =============
  A single-file signature pad. Sign with a mouse, pen, or finger, then save
  the ink as a transparent PNG trimmed to just the signature.

  LIBRARIES USED
  --------------
  No JavaScript libraries. Everything is plain HTML, CSS, and vanilla JS.
  Three free script fonts are loaded for typed signatures, from their
  official source, Google Fonts (one stylesheet for all three):
    https://fonts.googleapis.com/css2?family=Great+Vibes&family=Homemade+Apple&family=Sacramento&display=swap
    1. Great Vibes    - elegant, flowing script style
    2. Sacramento     - light, thin-pen script style
    3. Homemade Apple - casual, real-handwriting style
  Version note: Google Fonts doesn't offer version numbers in its links;
  it always serves the current release of each font. These three are
  long-stable, single-weight fonts (Google Fonts API v2, checked 2026-11-01).
  If the fonts can't load (for example, offline), the page says so and
  typed signatures use a script font already on your device.

  PRIVACY
  -------
  Nothing is ever sent to a server. The signature lives only in this browser
  tab, and "Save as PNG" creates the file right on your device. (The page
  downloads the three font files above, but never uploads anything.)

  VERSION HISTORY
  ---------------
  v1.0 - 2026-11-01 - Initial build: pointer-event drawing (mouse, pen, touch),
                      smooth curves, sharp on high-density screens, undo, clear,
                      ink colors, pen width, trimmed transparent PNG export,
                      checkerboard background, typed-signature option for
                      keyboard users, screen reader announcements.
  v1.1 - 2026-11-01 - Default ink is now a dark blue fountain-pen color.
                      Lines get slightly thicker when you move slowly and
                      thinner when you move fast, like real ink.
  v1.2 - 2026-11-01 - Three script font choices for typed signatures
                      (Great Vibes, Sacramento, Homemade Apple), each
                      previewing your typed name.
  v1.3 - 2026-11-01 - Fix: the three fonts all looked the same because they
                      weren't loading. They now come from Google Fonts, and
                      a message appears if they can't be loaded.
  v1.4 - 2026-11-01 - Fix: Clear (and Undo) now wipe the whole pad, even when
                      the page is zoomed out.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signature Pad</title>
  <!-- Script fonts for typed signatures (see the library list at the top) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Homemade+Apple&family=Sacramento&display=swap">
  <style>
    /* ---------- Color tokens (light and dark page themes) ---------- */
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5b6475;
      --border: #cfd4dc;
      --accent: #2f5bd3;
      --accent-text: #ffffff;
      --focus: #ffb000;
      --checker-a: #ffffff;
      --checker-b: #e3e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d;
        --card: #1e232c;
        --text: #eef1f6;
        --muted: #a5adbb;
        --border: #3a4250;
        --accent: #6f93ff;
        --accent-text: #0b1020;
        /* The checkerboard stays light so dark ink is always visible */
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .intro { margin: 0 0 20px; color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    /* ---------- Signing area ---------- */
    .pad-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 1;               /* wide box on larger screens */
      border: 2px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      /* Checkerboard: shows which parts of the PNG will be see-through */
      background-color: var(--checker-a);
      background-image: conic-gradient(
        var(--checker-b) 25%, transparent 0 50%,
        var(--checker-b) 0 75%, transparent 0
      );
      background-size: 20px 20px;
    }
    @media (max-width: 600px) {
      .pad-wrap { aspect-ratio: 2 / 1; } /* a bit taller on phones */
    }

    canvas#pad {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;   /* signing with a finger must not scroll or zoom */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    canvas#pad:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

    /* "Sign here" guide line - pure decoration, never exported */
    .guide {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 22%;
      border-bottom: 2px dashed #9aa3b2;
      pointer-events: none;
    }
    .guide::before {
      content: "\00D7";
      position: absolute;
      left: -1.1em;
      bottom: -0.15em;
      font-size: 1.4rem;
      color: #9aa3b2;
    }
    .placeholder {
      position: absolute;
      left: 0; right: 0;
      bottom: 8%;
      text-align: center;
      color: #7a8292;
      font-size: 0.95rem;
      pointer-events: none;
    }
    .placeholder[hidden] { display: none; }

    /* ---------- Controls ---------- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 28px;
      align-items: flex-end;
      margin-top: 16px;
    }

    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    legend, .label { font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; padding: 0; }

    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch { position: relative; }
    .swatch input {
      position: absolute;
      opacity: 0;
      width: 1px; height: 1px;
    }
    .swatch label {
      display: block;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 3px solid var(--card);
      box-shadow: 0 0 0 2px var(--border);
      cursor: pointer;
    }
    .swatch input:checked + label { box-shadow: 0 0 0 3px var(--accent); }
    .swatch input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 3px; }

    .width-control { display: flex; flex-direction: column; }
    .width-row { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { width: 160px; accent-color: var(--accent); }
    output { min-width: 3.5ch; font-variant-numeric: tabular-nums; }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-left: auto; }

    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      min-height: 44px;                  /* comfortable touch target */
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ---------- Typed signature (keyboard alternative) ---------- */
    details { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; }
    summary { cursor: pointer; font-weight: 600; }
    .typed-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
    .typed-row input[type="text"] {
      font: inherit;
      flex: 1 1 220px;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
    }

    /* Script font choices: each option previews the typed name */
    .font-choices { margin-top: 14px; }
    .font-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .font-option { position: relative; }
    .font-option input {
      position: absolute;
      opacity: 0;
      width: 1px; height: 1px;
    }
    .font-option label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 76px;
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
    }
    .font-option .font-name { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .font-option .font-sample {
      font-size: 1.7rem;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .font-option input:checked + label { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .font-option input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }

    .hint { color: var(--muted); font-size: 0.85rem; margin: 12px 0 0; }

    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .buttons { margin-left: 0; width: 100%; }
      .buttons button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Signature Pad</h1>
    <p class="intro">Sign in the box with a mouse, pen, or finger. Save it as a transparent PNG trimmed to just your ink.</p>

    <section class="card" aria-label="Signature pad">
      <div class="pad-wrap">
        <canvas id="pad"
                tabindex="0"
                role="img"
                aria-label="Signature drawing area. Draw with a mouse, pen, or finger. Keyboard users can type a signature below instead."
                aria-describedby="pad-status"></canvas>
        <div class="guide" aria-hidden="true"></div>
        <p class="placeholder" id="placeholder" aria-hidden="true">Sign above the line</p>
      </div>

      <div class="controls">
        <fieldset>
          <legend>Ink color</legend>
          <div class="swatches" id="swatches"><!-- filled in by JavaScript --></div>
        </fieldset>

        <div class="width-control">
          <label class="label" for="width">Pen width</label>
          <div class="width-row">
            <input type="range" id="width" min="1" max="12" step="0.5" value="3">
            <output for="width" id="width-out">3 px</output>
          </div>
        </div>

        <div class="buttons">
          <button type="button" id="undo" disabled aria-keyshortcuts="Control+Z Meta+Z">Undo</button>
          <button type="button" id="clear" disabled>Clear</button>
          <button type="button" id="save" class="primary" disabled>Save as PNG</button>
        </div>
      </div>

      <details>
        <summary>Type a signature instead</summary>
        <div class="typed-row">
          <label for="typed" class="visually-hidden">Your name</label>
          <input type="text" id="typed" autocomplete="name" placeholder="Type your name">
          <button type="button" id="add-typed">Add to pad</button>
        </div>
        <fieldset class="font-choices">
          <legend>Signature style</legend>
          <div class="font-options" id="font-options"><!-- filled in by JavaScript --></div>
          <p class="hint" id="font-note" hidden></p>
        </fieldset>
      </details>

      <p class="hint">Tip: press Ctrl+Z (or ⌘Z on a Mac) to undo the last stroke.</p>
    </section>

    <!-- Screen readers hear short updates from this area -->
    <p id="pad-status" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>

  <script>
    // v1.0 - initial build
    // v1.1 - fountain-pen blue default ink; speed-sensitive line width
    // v1.2 - three script font choices for typed signatures
    // v1.3 - fonts load from Google Fonts; note shown if they fail
    // v1.4 - clear wipes the whole pad at any zoom level
    "use strict";

    /* ------------------------------------------------------------------
       GRAB THE PAGE ELEMENTS WE NEED
       We look up each element once and keep a reference to it, so the
       rest of the code can use it without searching the page again.
    ------------------------------------------------------------------ */
    const canvas      = document.getElementById("pad");
    const ctx         = canvas.getContext("2d");
    const swatchesBox = document.getElementById("swatches");
    const widthInput  = document.getElementById("width");
    const widthOut    = document.getElementById("width-out");
    const undoBtn     = document.getElementById("undo");
    const clearBtn    = document.getElementById("clear");
    const saveBtn     = document.getElementById("save");
    const typedInput  = document.getElementById("typed");
    const addTypedBtn = document.getElementById("add-typed");
    const placeholder = document.getElementById("placeholder");
    const statusEl    = document.getElementById("pad-status");
    const fontOptions = document.getElementById("font-options");

    /* ------------------------------------------------------------------
       SCRIPT FONTS FOR TYPED SIGNATURES (v1.2)
       "family" must match the font name inside each font's stylesheet.
       FALLBACK_FONTS are script fonts many computers already have; the
       browser uses them if the web fonts couldn't be downloaded.
    ------------------------------------------------------------------ */
    const TYPED_FONTS = [
      { name: "Elegant", family: "Great Vibes" },
      { name: "Light",   family: "Sacramento" },
      { name: "Casual",  family: "Homemade Apple" }
    ];
    const FALLBACK_FONTS = "'Segoe Script', 'Brush Script MT', 'Snell Roundhand', 'Apple Chancery', cursive";
    let typedFont = TYPED_FONTS[0].family;

    // Builds the text a canvas needs to pick a font, e.g.
    // 48px "Great Vibes", 'Segoe Script', ..., cursive
    function fontCss(sizePx, family) {
      return sizePx + "px " + (family ? '"' + family + '", ' : "") + FALLBACK_FONTS;
    }

    /* ------------------------------------------------------------------
       INK COLOR CHOICES
       Each color becomes a round button (really a radio button with a
       colored label) so it works with mouse, touch, and keyboard arrows.
    ------------------------------------------------------------------ */
    // The first color is the default. v1.1 added "Fountain pen blue",
    // a deep blue-black like classic fountain-pen ink.
    const INK_COLORS = [
      { name: "Fountain pen blue", value: "#1c2b6e" },
      { name: "Black", value: "#111111" },
      { name: "Blue",  value: "#1f4fd1" },
      { name: "Navy",  value: "#14234f" },
      { name: "Red",   value: "#c4232b" },
      { name: "Green", value: "#1d7a3a" }
    ];

    /* ------------------------------------------------------------------
       THE DRAWING DATA
       Instead of only painting pixels, we remember every stroke as a list
       of points. That lets us:
         - undo (just drop the last item and repaint),
         - stay sharp when the window is resized or a phone is rotated,
         - repaint at high resolution when saving the PNG.

       Points are stored "normalized": x and y are divided by the canvas
       width, so 0.5 means "halfway across". Dividing BOTH by the width keeps
       the signature's shape the same even if the box changes height.
       The pen width is stored the same way, so lines scale evenly too.

       Each point in a stroke also carries "w", a thickness multiplier
       (about 0.6 to 1.3) worked out from how fast the pen was moving
       there. 1 means "exactly the chosen pen width".

       Each item in the list looks like one of these:
         { type: "stroke", color, width, points: [{x, y, w, t}, ...] }
         { type: "text",   color, size, x, y, text, font }
    ------------------------------------------------------------------ */
    const items = [];
    let currentStroke = null;      // the stroke being drawn right now
    let activePointerId = null;    // which finger/pen/mouse is drawing
    let padRect = null;            // the canvas position, saved at stroke start

    let inkColor = INK_COLORS[0].value;
    let penWidth = Number(widthInput.value);

    /* ------------------------------------------------------------------
       BUILD THE COLOR SWATCHES
       Creates one radio button + label per ink color.
    ------------------------------------------------------------------ */
    INK_COLORS.forEach(function (color, index) {
      const wrapper = document.createElement("div");
      wrapper.className = "swatch";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "ink";
      radio.id = "ink-" + index;
      radio.value = color.value;
      radio.checked = index === 0;

      const label = document.createElement("label");
      label.htmlFor = radio.id;
      label.style.background = color.value;
      label.title = color.name;
      // The label is a color circle with no visible text, so give it a
      // name screen readers can read aloud.
      label.setAttribute("aria-label", color.name);

      // When this color is picked, remember it for the next stroke.
      radio.addEventListener("change", function () {
        inkColor = radio.value;
      });

      wrapper.append(radio, label);
      swatchesBox.append(wrapper);
    });

    /* ------------------------------------------------------------------
       PEN WIDTH SLIDER
       Updates the pen width and the little "3 px" readout beside it.
    ------------------------------------------------------------------ */
    widthInput.addEventListener("input", function () {
      penWidth = Number(widthInput.value);
      widthOut.textContent = penWidth + " px";
    });

    /* ------------------------------------------------------------------
       KEEP THE CANVAS SHARP ON EVERY SCREEN
       Phones and many laptops have "high density" screens that pack 2 or 3
       real pixels into each CSS pixel. If the canvas only had 1 pixel per
       CSS pixel, lines would look blurry. So we size the canvas's internal
       pixel grid to (CSS size x devicePixelRatio), then scale the drawing
       so our code can keep working in normal CSS pixels.
    ------------------------------------------------------------------ */
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.round(rect.width  * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }

    // Repaint whenever the box changes size (window resize, phone rotation,
    // zooming the page, moving to a screen with a different density).
    new ResizeObserver(resizeCanvas).observe(canvas);

    /* ------------------------------------------------------------------
       SPEED-SENSITIVE INK (v1.1)
       Real ink pools a little when the pen moves slowly and thins out
       when it moves quickly. These numbers control that effect:
         SLOW_FACTOR - thickness multiplier when the pen is nearly still
         FAST_FACTOR - thickness multiplier at FAST_SPEED or faster
         FAST_SPEED  - speed (CSS pixels per millisecond) counted as "fast"
         SMOOTHING   - how gently the thickness changes (0-1, lower is
                       gentler) so lines never look lumpy
    ------------------------------------------------------------------ */
    const SLOW_FACTOR = 1.3;
    const FAST_FACTOR = 0.6;
    const FAST_SPEED  = 2.5;
    const SMOOTHING   = 0.3;

    /* ------------------------------------------------------------------
       ONE PIECE OF A STROKE
       Because the thickness changes along the line, each stroke is drawn
       as many short curved pieces, each with its own line width. Round
       ends on every piece make them blend together seamlessly.

       strokeSegment(c, item, i, w) draws piece number "i":
         - pieces 1 .. (points-2) are curves that bend toward point i,
           running from midpoint to midpoint (the smoothing trick);
         - the last piece is a short straight line to the final point.
       Both the live drawing and the full repaint use this same function,
       so what you see while signing matches what gets saved.
    ------------------------------------------------------------------ */
    function strokeSegment(c, item, i, w) {
      const p = item.points;
      const n = p.length;
      c.strokeStyle = item.color;
      c.lineCap = "round";
      c.lineJoin = "round";
      c.beginPath();

      if (i < n - 1) {
        // Curved piece bending toward point i.
        const start = i === 1 ? p[0] : { x: (p[i - 1].x + p[i].x) / 2, y: (p[i - 1].y + p[i].y) / 2 };
        const endX = (p[i].x + p[i + 1].x) / 2;
        const endY = (p[i].y + p[i + 1].y) / 2;
        c.lineWidth = item.width * p[i].w * w;
        c.moveTo(start.x * w, start.y * w);
        c.quadraticCurveTo(p[i].x * w, p[i].y * w, endX * w, endY * w);
      } else {
        // Final straight piece into the last point.
        const start = n >= 3 ? { x: (p[n - 2].x + p[n - 1].x) / 2, y: (p[n - 2].y + p[n - 1].y) / 2 } : p[0];
        c.lineWidth = item.width * p[n - 1].w * w;
        c.moveTo(start.x * w, start.y * w);
        c.lineTo(p[n - 1].x * w, p[n - 1].y * w);
      }
      c.stroke();
    }

    /* ------------------------------------------------------------------
       DRAW ONE ITEM (a stroke or typed text) ONTO A CANVAS
       "w" is the width in CSS pixels of the area we're drawing into; we
       multiply the stored normalized numbers by it to get real positions.

       SMOOTH LINES: rather than joining points with straight segments
       (which looks jagged), we draw gentle curves. Each curve runs from the
       midpoint between two points to the next midpoint, bending toward the
       real point in between. This is a classic trick that produces smooth,
       natural-looking handwriting.
    ------------------------------------------------------------------ */
    function drawItem(c, item, w) {
      if (item.type === "text") {
        c.fillStyle = item.color;
        c.font = fontCss(item.size * w, item.font);
        c.textBaseline = "alphabetic";
        c.fillText(item.text, item.x * w, item.y * w);
        return;
      }

      const pts = item.points;

      // A single tap: draw a round dot.
      if (pts.length === 1) {
        c.fillStyle = item.color;
        c.beginPath();
        c.arc(pts[0].x * w, pts[0].y * w, item.width * pts[0].w * w / 2, 0, Math.PI * 2);
        c.fill();
        return;
      }

      // Draw every piece of the stroke, each with its own thickness
      // (see strokeSegment above). Piece 1 is the first curve; the
      // last piece (number points-1) is the straight finish.
      for (let i = 1; i < pts.length; i++) {
        strokeSegment(c, item, i, w);
      }
    }

    /* ------------------------------------------------------------------
       REPAINT EVERYTHING
       Wipes the canvas and draws every saved item again. Used after undo,
       clear, resize, and at the end of each stroke.
    ------------------------------------------------------------------ */
    function redraw() {
      const w = canvas.getBoundingClientRect().width;

      // Wipe EVERY pixel of the canvas. (v1.4 fix) The drawing is normally
      // scaled to CSS pixels, but canvas.width/height count real screen
      // pixels. When the page is zoomed out, those don't match, and the
      // old wipe only cleared part of the box. So we briefly switch back
      // to plain screen pixels for the wipe, then restore the scaling.
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      items.forEach(function (item) { drawItem(ctx, item, w); });
      if (currentStroke) drawItem(ctx, currentStroke, w);
    }

    /* ------------------------------------------------------------------
       DRAW JUST THE NEWEST PIECE OF THE STROKE
       While your pen is moving we don't repaint everything (that could get
       slow). We only add the newest little curve, using the same midpoint
       method as drawItem so the result looks identical.
    ------------------------------------------------------------------ */
    function drawLatestSegment() {
      const n = currentStroke.points.length;
      // A curve bending toward a point can only be drawn once the point
      // after it exists, so with n points the newest finished curve is
      // piece number n-2. (The straight finish is added on pointer up.)
      if (n < 3) return;
      strokeSegment(ctx, currentStroke, n - 2, padRect.width);
    }

    /* ------------------------------------------------------------------
       TURN A POINTER EVENT INTO A NORMALIZED POINT
       Works out where the pointer is inside the canvas, then divides by
       the canvas width (see "THE DRAWING DATA" above).
    ------------------------------------------------------------------ */
    function toPoint(ev) {
      return {
        x: (ev.clientX - padRect.left) / padRect.width,
        y: (ev.clientY - padRect.top)  / padRect.width
      };
    }

    /* ------------------------------------------------------------------
       POINTER DOWN - START A STROKE
       Pointer events cover mouse, pen, and touch with one set of code.
       We "capture" the pointer so the stroke keeps going even if your
       finger slides outside the box, and we ignore any second finger so
       a resting palm or thumb doesn't scribble.
    ------------------------------------------------------------------ */
    canvas.addEventListener("pointerdown", function (ev) {
      if (activePointerId !== null) return;               // already drawing
      if (ev.pointerType === "mouse" && ev.button !== 0) return; // left button only

      ev.preventDefault();                                // no scrolling, no text selection
      canvas.setPointerCapture(ev.pointerId);
      activePointerId = ev.pointerId;
      padRect = canvas.getBoundingClientRect();

      currentStroke = {
        type: "stroke",
        color: inkColor,
        width: penWidth / padRect.width,
        points: [toPoint(ev)]
      };
      // The first point starts at the normal pen width, and we note the
      // time so the next point can work out how fast the pen moved.
      currentStroke.points[0].w = 1;
      currentStroke.points[0].t = ev.timeStamp;

      // Show a dot right away so a quick tap is visible immediately.
      redraw();
    });

    /* ------------------------------------------------------------------
       POINTER MOVE - ADD POINTS TO THE STROKE
       Browsers may bundle several tiny movements into one event to save
       work. getCoalescedEvents() hands us all of them, which gives much
       smoother, more detailed lines - especially with a pen.
    ------------------------------------------------------------------ */
    canvas.addEventListener("pointermove", function (ev) {
      if (ev.pointerId !== activePointerId || !currentStroke) return;
      ev.preventDefault();

      const events = typeof ev.getCoalescedEvents === "function" ? ev.getCoalescedEvents() : [];
      const list = events.length ? events : [ev];

      list.forEach(function (e) {
        const pt = toPoint(e);
        const pts = currentStroke.points;
        const prev = pts[pts.length - 1];

        // Skip points that barely moved (less than half a CSS pixel);
        // they add no detail and can make lines look fuzzy.
        const dx = (pt.x - prev.x) * padRect.width;
        const dy = (pt.y - prev.y) * padRect.width;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.5) return;

        // SPEED -> THICKNESS (v1.1)
        // Speed is distance moved divided by time taken. Slow movement
        // gives a multiplier near SLOW_FACTOR (thicker), fast movement
        // near FAST_FACTOR (thinner). We then blend it with the previous
        // point's value so the thickness changes gradually, like ink.
        const dt = e.timeStamp - prev.t;
        let target = prev.w;
        if (dt > 0) {
          const speed = dist / dt;
          const amount = Math.min(speed / FAST_SPEED, 1);
          target = SLOW_FACTOR - (SLOW_FACTOR - FAST_FACTOR) * amount;
        }
        pt.w = prev.w + (target - prev.w) * SMOOTHING;
        pt.t = e.timeStamp;

        pts.push(pt);
        drawLatestSegment();
      });
    });

    /* ------------------------------------------------------------------
       POINTER UP / CANCEL - FINISH THE STROKE
       Saves the stroke into the list, repaints cleanly, and updates the
       buttons. "pointercancel" happens if the browser interrupts (for
       example an incoming call); we keep what was drawn so far.
    ------------------------------------------------------------------ */
    function endStroke(ev) {
      if (ev.pointerId !== activePointerId) return;
      if (canvas.hasPointerCapture(ev.pointerId)) canvas.releasePointerCapture(ev.pointerId);

      if (currentStroke) items.push(currentStroke);
      currentStroke = null;
      activePointerId = null;

      redraw();
      updateUi();
    }
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    canvas.addEventListener("lostpointercapture", endStroke);

    // Stop the long-press menu ("Save image?") from popping up on phones.
    canvas.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

    /* ------------------------------------------------------------------
       UNDO, CLEAR, AND KEYBOARD SHORTCUT
    ------------------------------------------------------------------ */
    function undo() {
      if (!items.length) return;
      items.pop();
      redraw();
      updateUi();
      announce(items.length ? "Last stroke removed." : "Pad is empty.");
    }

    function clearPad() {
      if (!items.length) return;
      items.length = 0;
      redraw();
      updateUi();
      announce("Signature cleared.");
    }

    undoBtn.addEventListener("click", undo);
    clearBtn.addEventListener("click", clearPad);

    // Ctrl+Z / Cmd+Z undoes - but not while typing in the name box,
    // where it should undo typing instead.
    document.addEventListener("keydown", function (ev) {
      const typing = document.activeElement && document.activeElement.tagName === "INPUT" &&
                     document.activeElement.type === "text";
      if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase() === "z" && !typing) {
        ev.preventDefault();
        undo();
      }
    });

    /* ------------------------------------------------------------------
       TYPED SIGNATURE (for people who can't or prefer not to draw)
       Places the typed name in a script-style font, sitting on the guide
       line, in the current ink color. It behaves like a stroke: Undo
       removes it and it's included in the PNG.
    ------------------------------------------------------------------ */
    /* ------------------------------------------------------------------
       BUILD THE FONT CHOICES (v1.2)
       One radio button per font. Each label shows the font's name and a
       preview of your typed name (or "Your Name" until you type) written
       in that font, so you can see which you like before adding it.
    ------------------------------------------------------------------ */
    const fontSamples = [];
    TYPED_FONTS.forEach(function (font, index) {
      const wrapper = document.createElement("div");
      wrapper.className = "font-option";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "typed-font";
      radio.id = "font-" + index;
      radio.value = font.family;
      radio.checked = index === 0;
      radio.addEventListener("change", function () { typedFont = radio.value; });

      const label = document.createElement("label");
      label.htmlFor = radio.id;

      const nameEl = document.createElement("span");
      nameEl.className = "font-name";
      nameEl.textContent = font.name + " (" + font.family + ")";

      // The preview is decoration: the font's name is what a screen reader
      // should read, so the sample is hidden from assistive technology.
      const sample = document.createElement("span");
      sample.className = "font-sample";
      sample.style.fontFamily = '"' + font.family + '", ' + FALLBACK_FONTS;
      sample.setAttribute("aria-hidden", "true");
      fontSamples.push(sample);

      label.append(nameEl, sample);
      wrapper.append(radio, label);
      fontOptions.append(wrapper);
    });

    // Keep every preview showing what's typed in the name box.
    function updateFontPreviews() {
      const text = typedInput.value.trim() || "Your Name";
      fontSamples.forEach(function (s) { s.textContent = text; });
    }
    typedInput.addEventListener("input", updateFontPreviews);
    updateFontPreviews();

    /* ------------------------------------------------------------------
       MAKE SURE THE FONTS ACTUALLY LOADED (v1.3)
       Browsers only download a web font when something needs it, and if
       the download fails they quietly use another font - which is how all
       three choices ended up looking identical. Here we ask for each font
       up front, then check it really arrived. If any are missing, a note
       under the choices says so, instead of failing silently.
    ------------------------------------------------------------------ */
    const fontNote = document.getElementById("font-note");
    // document.fonts.load() hands back a list of the font files it
    // loaded. An empty list means the font was never found (for example,
    // the stylesheet was blocked), so we treat that as a failure.
    Promise.all(TYPED_FONTS.map(function (font) {
      return document.fonts.load('40px "' + font.family + '"', "Ab")
        .then(function (loaded) { return loaded.length > 0; })
        .catch(function () { return false; });
    })).then(function (results) {
      const missing = TYPED_FONTS.filter(function (f, i) { return !results[i]; });
      if (missing.length) {
        fontNote.textContent = "Couldn't load " + missing.map(function (f) { return f.family; }).join(", ") +
          ". Those styles will use a script font from your device instead. Check your internet connection and reload.";
        fontNote.hidden = false;
      }
    });

    async function addTyped() {
      const text = typedInput.value.trim();
      if (!text) {
        announce("Type a name first.");
        typedInput.focus();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const family = typedFont;

      // Web fonts download only when first needed. A canvas won't wait
      // for them, so we ask the browser to finish loading the chosen font
      // first. If it can't (for example offline), we carry on and the
      // fallback script font is used instead.
      try {
        await document.fonts.load(fontCss(40, family), text);
      } catch (err) {
        // Ignore - the fallback font will be used.
      }

      // Start with a font size based on the box height, then shrink it
      // if the name is too long to fit across the box.
      let sizePx = rect.height * 0.42;
      ctx.font = fontCss(sizePx, family);
      const maxWidth = w * 0.84;
      const measured = ctx.measureText(text).width;
      if (measured > maxWidth) sizePx *= maxWidth / measured;

      items.push({
        type: "text",
        color: inkColor,
        size: sizePx / w,
        x: 0.08,
        y: (rect.height * 0.76) / w,   // just above the dashed guide line
        text: text,
        font: family
      });
      redraw();
      updateUi();
      announce("Typed signature added to the pad.");
    }
    addTypedBtn.addEventListener("click", addTyped);
    typedInput.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); addTyped(); }
    });

    /* ------------------------------------------------------------------
       SAVE AS PNG - TRANSPARENT AND TRIMMED TO THE INK
       1. Repaint every item onto a hidden canvas at high resolution
          (at least 2x) so the saved image is crisp. Nothing paints a
          background, so empty areas stay transparent.
       2. Scan the pixels to find the smallest box containing any ink.
       3. Copy just that box (plus a little breathing room) to a second
          hidden canvas and download it as a PNG.
       All of this happens on your device - nothing is uploaded.
    ------------------------------------------------------------------ */
    function savePng() {
      if (!items.length) return;

      const rect = canvas.getBoundingClientRect();
      const scale = Math.max(2, window.devicePixelRatio || 1);
      const full = document.createElement("canvas");
      full.width  = Math.round(rect.width  * scale);
      full.height = Math.round(rect.height * scale);
      const fctx = full.getContext("2d");
      fctx.setTransform(scale, 0, 0, scale, 0, 0);
      items.forEach(function (item) { drawItem(fctx, item, rect.width); });

      // Step 2: find the edges of the ink by checking each pixel's
      // transparency (the 4th number of every pixel is its "alpha").
      const data = fctx.getImageData(0, 0, full.width, full.height).data;
      let minX = full.width, minY = full.height, maxX = -1, maxY = -1;
      for (let y = 0; y < full.height; y++) {
        for (let x = 0; x < full.width; x++) {
          if (data[(y * full.width + x) * 4 + 3] > 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) { announce("There's no ink inside the box to save."); return; }

      // Step 3: crop with a small margin so the edges of the ink aren't cut.
      const pad = Math.round(6 * scale);
      const sx = Math.max(0, minX - pad);
      const sy = Math.max(0, minY - pad);
      const sw = Math.min(full.width,  maxX + pad + 1) - sx;
      const sh = Math.min(full.height, maxY + pad + 1) - sy;

      const out = document.createElement("canvas");
      out.width = sw;
      out.height = sh;
      out.getContext("2d").drawImage(full, sx, sy, sw, sh, 0, 0, sw, sh);

      // Turn the canvas into a PNG file and trigger a download.
      out.toBlob(function (blob) {
        if (!blob) { announce("Sorry, the image couldn't be created."); return; }
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "signature.png";
        document.body.append(link);
        link.click();
        link.remove();
        // Free the memory a moment later, once the download has started.
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        announce("Signature saved as signature.png.");
      }, "image/png");
    }
    saveBtn.addEventListener("click", savePng);

    /* ------------------------------------------------------------------
       KEEP BUTTONS AND HINTS IN SYNC
       Undo, Clear, and Save only make sense when there's ink, and the
       "Sign above the line" hint hides once you start.
    ------------------------------------------------------------------ */
    function updateUi() {
      const empty = items.length === 0;
      undoBtn.disabled = empty;
      clearBtn.disabled = empty;
      saveBtn.disabled = empty;
      placeholder.hidden = !empty;
      canvas.setAttribute("aria-label", empty
        ? "Signature drawing area, empty. Draw with a mouse, pen, or finger. Keyboard users can type a signature below instead."
        : "Signature drawing area containing " + items.length + (items.length === 1 ? " stroke." : " strokes."));
    }

    /* ------------------------------------------------------------------
       SCREEN READER ANNOUNCEMENTS
       Puts a short message into a hidden "live" area that screen readers
       read aloud. Clearing it first makes repeated messages speak again.
    ------------------------------------------------------------------ */
    function announce(message) {
      statusEl.textContent = "";
      setTimeout(function () { statusEl.textContent = message; }, 50);
    }

    // First paint and button states.
    resizeCanvas();
    updateUi();
  </script>
</body>
</html>
