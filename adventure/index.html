<style>
  /* Black and white only, like a 1980s Mac. Fonts fall back to whatever monospace is installed. */
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; padding: 12px; min-height: 100vh;
    background: #fff; color: #000;
    /* Classic checkerboard desktop pattern */
    background-image: linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%),
                      linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%);
    background-size: 4px 4px; background-position: 0 0, 2px 2px;
    font-family: Chicago, Geneva, "Courier New", monospace; font-size: 18px; line-height: 1.4;
  }
  /* The Mac window */
  .window { max-width: 640px; margin: 0 auto; background: #fff; border: 2px solid #000; box-shadow: 5px 5px 0 #000; }
  .titlebar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 2px solid #000;
    background: repeating-linear-gradient(#000 0 1px, #fff 1px 3px); }
  .titlebar span { background: #fff; padding: 0 10px; font-weight: bold; margin: 0 auto; }
  .closebox { width: 14px; height: 14px; border: 2px solid #000; background: #fff; }
  main { padding: 14px; }
  .art { border: 2px solid #000; background: #fff; margin-bottom: 12px; }
  .art svg { display: block; width: 100%; height: auto; stroke: #000; fill: #fff; stroke-width: 1.1; shape-rendering: crispEdges; }
  h1 { font-size: 1.1em; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  h1:focus { outline: none; }
  .story p { margin: 0 0 8px; }
  .end { display: inline-block; border: 2px solid #000; padding: 2px 12px; font-weight: bold; margin: 4px 0 8px; }
  ol { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
  /* HyperCard-style rounded buttons that invert when pressed or focused */
  button { font: inherit; width: 100%; text-align: left; padding: 8px 14px; background: #fff; color: #000;
    border: 2px solid #000; border-radius: 10px; box-shadow: 2px 2px 0 #000; cursor: pointer; min-height: 44px; }
  button:hover, button:focus-visible { background: #000; color: #fff; outline: 3px solid #000; outline-offset: 2px; }
  button:active { box-shadow: none; transform: translate(2px,2px); }
  .toolbar { border-top: 2px solid #000; padding: 6px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  .toolbar button { width: auto; min-height: 32px; padding: 2px 10px; font-size: 14px; }
  @media (max-width: 480px) { body { font-size: 16px; padding: 6px; } }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
<style>

  .home-link {
    position: fixed; top: 12px; left: 12px;
    z-index: 1000; /* keeps it above other content */
    padding: 8px 14px; background: #fff; color: #1f2a44;
    font: 600 16px/1.2 system-ui, sans-serif; text-decoration: none;

  /* Leave room at the top so the link never covers the game window */
  body { padding-top: 60px; }
</style>

/* ==========================================================================
   THE STORY - EDIT HERE!
   Everything the player reads lives in this section: scene titles, the text,
   and the choices (button labels and where each one leads).
   - "to" is the id of the scene the button goes to.
   - "snd" plays a sound when the button is pressed: squeak, moan, growl, celebrate.
   - "onEnter" plays a sound when the scene appears (squeak, moan, growl, celebrate).
   - "art" is the name of a picture (or a function that picks one) in the PICTURES section further down.
   - "end: true" marks an ending (shows THE END).

// Each scene has: title, art, text (a function so it can change with game state),
// choices (label, destination, optional sound), and optional onEnter sound / end flag.
const MONSTER = ['Eyes peer out of the darkness. You hear a low growl.', 'A monster appears! You flee in terror!'];
const AGAIN = [{ label: 'Play again', to: 'front', reset: true }];

const SCENES = {

/* ---------- SOUND (all built from code - no audio files to load, so nothing can go missing) ---------- */
let audioCtx = null;   // created on first click, because browsers require a user gesture
let bus = null;        // (echo mixing board)
let dry = null;        // a second output with no echo, for close-up "foley" sounds        // the shared "mixing board" every sound goes through (adds a little spooky echo)
let soundOn = true;    // the player can mute with the toolbar button

// Get (or create) the audio system, build the echo bus the first time, and wake it up if paused.
function getAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) {
    audioCtx = new AC();
    bus = audioCtx.createGain(); bus.gain.value = 0.9; bus.connect(audioCtx.destination);   // dry (direct) sound
    const echo = audioCtx.createDelay(); echo.delayTime.value = 0.23;                       // a room-like echo...
    const feedback = audioCtx.createGain(); feedback.gain.value = 0.35;                     // ...that repeats and fades
    const damp = audioCtx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 1800;  // each repeat gets duller
    const wet = audioCtx.createGain(); wet.gain.value = 0.3;
    dry = audioCtx.createGain(); const comp = audioCtx.createDynamicsCompressor();   // close-mic path: direct sound, lightly compressed
    dry.connect(comp); comp.connect(audioCtx.destination);
    bus.connect(echo); echo.connect(damp); damp.connect(feedback); feedback.connect(echo); damp.connect(wet); wet.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// A smooth musical tone. "points" = [seconds, hz] pairs the pitch glides through.
// lfoHz/lfoDepth wobble the pitch (vibrato or growl); "delay" starts it later.
function synth(type, points, dur, vol, lowpass, lfoHz = 0, lfoDepth = 0, delay = 0) {
  const c = getAudio(); if (!c || !soundOn) return;
  const t = c.currentTime + delay;
  const osc = c.createOscillator(), filt = c.createBiquadFilter(), gain = c.createGain();
  osc.type = type;
  points.forEach(([s, hz], i) => i ? osc.frequency.linearRampToValueAtTime(hz, t + s) : osc.frequency.setValueAtTime(hz, t));
  filt.type = 'lowpass'; filt.frequency.value = lowpass;
  gain.gain.setValueAtTime(0, t);                      // fade in quickly...
  gain.gain.linearRampToValueAtTime(vol, t + dur * 0.15);
  gain.gain.linearRampToValueAtTime(0, t + dur);       // ...then fade out
  if (lfoHz) {
    const lfo = c.createOscillator(), depth = c.createGain();
    lfo.frequency.value = lfoHz; depth.gain.value = lfoDepth;
    lfo.connect(depth); depth.connect(osc.frequency);
    lfo.start(t); lfo.stop(t + dur);
  }
  osc.connect(filt); filt.connect(gain); gain.connect(bus);
  osc.start(t); osc.stop(t + dur);
}

// A burst of filtered static (noise) that dies away quickly. Great for clicks, thumps, wind and wing flutter.
// type = filter kind, freq = filter pitch (optionally sliding to freqEnd), q = how narrow the filter is.
function noise(type, freq, q, dur, vol, delay = 0, freqEnd = null, out = null) {
  const c = getAudio(); if (!c || !soundOn) return;
  const t = c.currentTime + delay;
  const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;   // random static
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
  if (freqEnd) f.frequency.linearRampToValueAtTime(freqEnd, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(out || bus); src.start(t);
}

/* ---------- PICTURES ----------
   Drawn in the style of the 1986 Mac game "Uninvited": first-person room views, heavy black outlines,
   and dithered (dotted) shading. The shading patterns (d25 light, d50 medium, d75 dark, hatch, tile)
   are defined once near the top of the page in the hidden <svg> and reused here with fill="url(#name)". */
const pic = inner => `<svg viewBox="0 0 300 165" aria-hidden="true"><g transform="scale(1.5)">${inner}</g></svg>`;
// room(): a one-point-perspective room - back wall, floor, ceiling and two side walls
const LIGHTER = { 'url(#d75)': 'url(#d50)', 'url(#d50)': 'url(#d25)', 'url(#d25)': 'url(#d12)', 'url(#hatch)': 'url(#d25)' };
const room = (wall, floor, side, planks = true) => {
  // side walls are cut into 3 strips that get lighter toward the back, like light fading into the room
  const strip = (x0, x1, fill, flip) => { const f = x => flip ? 200 - x : x;
    return `<polygon points="${f(x0)},${x0/2} ${f(x1)},${x1/2} ${f(x1)},${110-.6*x1} ${f(x0)},${110-.6*x0}" fill="${fill}"/>`; };
  let out = '';
  [false, true].forEach(fl => { out += strip(0, 22, side, fl) + strip(22, 38, side, fl) + strip(38, 50, LIGHTER[side] || side, fl); });
  out += `<polygon points="0,0 200,0 150,25 50,25" fill="#fff"/><path d="M0 0L50 25M200 0L150 25M50 25h100" fill="none"/>`;           // ceiling + molding
  out += `<polygon points="0,110 200,110 150,80 50,80" fill="${floor}"/>`;
  if (LIGHTER[floor]) out += `<polygon points="50,80 150,80 160,86.5 40,86.5" fill="${LIGHTER[floor]}" stroke="none"/>`;                  // lighter floor at the back
  if (planks) out += '<path d="M50 80L0 110M70 80L40 110M90 80L80 110M110 80L120 110M130 80L160 110M150 80L200 110" fill="none" stroke-width=".6"/>';
  out += `<rect x="50" y="25" width="100" height="55" fill="${wall}"/><path d="M50 76h100M0 103L50 76M200 103L150 76" fill="none" stroke-width=".7"/>`;  // baseboards
  return out;
};
// web(): a cobweb in a corner (sx/sy = +1 or -1 to flip which corner it hangs in)
const web = (x, y, sx, sy) => `<path d="M${x} ${y}l${26*sx} ${9*sy}M${x} ${y}l${17*sx} ${18*sy}M${x} ${y}l${7*sx} ${26*sy}M${x+9*sx} ${y+3*sy}q-1 ${8*sy} ${-6*sx} ${9*sy}M${x+17*sx} ${y+6*sy}q-2 ${12*sy} ${-10*sx} ${13*sy}" fill="none" stroke-width=".5"/>`;
// bat(): a small bat silhouette
const bat = (x, y) => `<path d="M${x} ${y}q4-6 8-1q4-5 8 1q-4 1-8 4q-4-3-8-4z" fill="#000"/>`;
// monster(): glowing eyes, horns, jagged teeth and claws coming out of the dark
const monster = extra => pic(`<rect width="200" height="110" fill="#000" stroke="none"/>${extra}` +
  `<polygon points="62,48 55,18 80,36" fill="#fff" stroke="#fff"/><polygon points="138,48 145,18 120,36" fill="#fff" stroke="#fff"/>` +
  `<path d="M58 110Q50 50 100 32Q150 50 142 110Z" fill="url(#d25)" stroke="#fff"/>` +
  `<ellipse cx="80" cy="60" rx="10" ry="6" fill="#fff"/><ellipse cx="120" cy="60" rx="10" ry="6" fill="#fff"/>` +
  `<path d="M80 54v12M120 54v12" stroke="#000" stroke-width="3"/>` +
  `<path d="M72 84L80 98L88 84L96 99L104 84L112 99L120 84L128 98" fill="#000" stroke="#fff"/>` +
  `<path d="M20 110l8-22 5 22M36 110l5-18 4 18M155 110l5-18 4 18M170 110l8-22 5 22" fill="#fff" stroke="#fff"/>`);
// ---------- ATTIC: a peaked-roof attic seen from the stairs, looking along the ridge. atticPic(true) adds flying bats. ----------
// P(x, y, p) turns a spot on the 'near plane' (x, y) into its place on the picture when it is p of the way toward the far wall (p = 0 is closest).
// K > 1 makes the near plane bigger than the picture, so the floor, knee walls and roof run off the edges and we feel we are standing inside the room.
const atticPic = bats => {
  const K = 1.2, P = (x, y, p) => [100 + (x - 100) * K * (1 - p), 50 + (y - 50) * K * (1 - p)];
  const pt = a => a[0].toFixed(1) + ',' + a[1].toFixed(1), mv = a => a[0].toFixed(1) + ' ' + a[1].toFixed(1);
  const pg = (fill, ...ps) => `<polygon points="${ps.map(pt).join(' ')}" fill="${fill}"/>`;
  const ln = (a, b, sw = .5, col = '#000', dash = '') => `<path d="M${mv(a)}L${mv(b)}" stroke="${col}" stroke-width="${sw}" fill="none"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  const mirror = inner => `<g transform="translate(200 0) scale(-1 1)">${inner}</g>`;
  const sn = (k, seed = 0) => Math.abs(Math.sin(k * 12.9898 + seed * 78.233));
  const FAR = .5, roofY = x => 70 - 0.66 * Math.min(x, 200 - x);                       // far wall depth; height of the roof line above any spot
  const woods = ['#fff', 'url(#b2)', 'url(#d12)', 'url(#b4)', '#fff', 'url(#d12)', 'url(#b2)'];
  // ----- the far gable wall, now close and lit by the light from the stairs: tall boards of different tones with grain, knots and nail heads,
  // a horizontal ledger brace, and water stains -----
  const S = K * (1 - FAR);                                                             // how big things on the far wall are drawn
  let far = pg('#fff', P(0, 110, FAR), P(0, 70, FAR), P(100, 4, FAR), P(200, 70, FAR), P(200, 110, FAR));
  const edges = [0, 4, 16, 28, 40, 52, 64, 76, 88, 100, 112, 124, 136, 148, 160, 172, 184, 196, 200];
  for (let i = 0; i < edges.length - 1; i++) {
    const e0 = edges[i], e1 = edges[i + 1], m = (e0 + e1) / 2;
    far += pg(woods[(i * 3 + 1) % 7], P(e0, 110, FAR), P(e1, 110, FAR), P(e1, roofY(e1), FAR), P(e0, roofY(e0), FAR)) + ln(P(e0, 110, FAR), P(e0, roofY(e0), FAR), .7);
    far += ln(P(m - 2.5, 110, FAR), P(m - 2.5, roofY(m - 2.5), FAR), .25, '#000', '9 2 4 3') + ln(P(m + 3, 110, FAR), P(m + 3, roofY(m + 3), FAR), .2, '#000', '5 3 12 2');   // grain
    if (sn(i, 3) > .4) { const c = P(m, 50 + sn(i, 4) * 50, FAR); far += `<ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(3 * S).toFixed(1)}" ry="${(4.6 * S).toFixed(1)}" fill="url(#d50)" stroke-width=".4"/><ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(1.4 * S).toFixed(1)}" ry="${(2.4 * S).toFixed(1)}" fill="#000" stroke="none"/>`; }   // knots
    [98, 76].forEach(y => { if (y < roofY(m) - 6) { const c = P(m, y, FAR); far += `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r=".6" fill="#000" stroke="none"/>`; } });                            // nail heads
  }
  far += ln(P(100, 4, FAR), P(100, 110, FAR), .3, '#000', '2 2');
  far += pg('#fff', P(0, 82, FAR), P(200, 82, FAR), P(200, 92, FAR), P(0, 92, FAR)) + pg('url(#d50)', P(0, 89, FAR), P(200, 89, FAR), P(200, 92, FAR), P(0, 92, FAR)) + ln(P(0, 82, FAR), P(200, 82, FAR), .7) + ln(P(0, 92, FAR), P(200, 92, FAR), .7) + ln(P(0, 86, FAR), P(200, 86, FAR), .25, '#000', '8 2 3 3');   // ledger brace
  for (let x = 6; x < 200; x += 12) { const c = P(x, 85.5, FAR); far += `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r=".6" fill="#000" stroke="none"/>`; }
  [[146, 60, 16, 24], [52, 74, 12, 16], [172, 96, 14, 10]].forEach(([x, y, rx, ry]) => { const c = P(x, y, FAR); far += `<ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(rx * S).toFixed(1)}" ry="${(ry * S).toFixed(1)}" fill="url(#b4)" stroke="none"/>`; });   // water stains
  far += pg('url(#b2)', P(0, 110, FAR), P(0, 70, FAR), P(100, 4, FAR), P(200, 70, FAR), P(200, 110, FAR));       // the light dims a little toward the corners
  // ----- left half (the right half is a mirror image): roof boards, knee wall, rafters, collar ties -----
  let roof = '', N = 7;
  for (let k = 0; k < N; k++) {                                                       // big roofing boards running along the roof, each a different tone
    const u0 = k / N, u1 = (k + 1) / N, a0 = [100 * u0, 70 - 66 * u0], a1 = [100 * u1, 70 - 66 * u1];
    roof += pg(woods[(k * 3 + 1) % 7], a0, a1, P(a1[0], a1[1], FAR), P(a0[0], a0[1], FAR)) + ln(a0, P(a0[0], a0[1], FAR), .7);
    const mid = [(a0[0] + a1[0]) / 2, (a0[1] + a1[1]) / 2];
    roof += ln(mid, P(mid[0], mid[1], FAR), .25, '#000', '6 2 3 3') + ln([a0[0] * .5 + a1[0] * .5 + 1.5, mid[1] - 1], P(mid[0] + 1.5, mid[1] - 1, FAR), .2, '#000', '3 4');   // grain
    [.2, .35, .5].forEach((p, i) => { if (sn(k * 3 + i, 9) > .45) { const c = P(mid[0], mid[1], p); roof += `<ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(2.2 * K * (1 - p)).toFixed(1)}" ry="${(3.2 * K * (1 - p)).toFixed(1)}" fill="url(#d50)" stroke-width=".4"/>`; } });  // knots
  }
  roof += ln([100, 4], P(100, 4, FAR), 1.4);                                          // ridge board
  let knee = pg('url(#d50)', [0, 110], [0, 70], P(0, 70, FAR), P(0, 110, FAR));        // vertical knee wall under the slope, with plank lines and studs
  [80, 90, 100].forEach(y => knee += ln([0, y], P(0, y, FAR), .4));
  const depths = [0, .07, .14, .21, .28, .35, .41, .46, .5];
  depths.slice().reverse().forEach(p => {                                              // rafters, far to near, so near ones cover far ones
    if (p > 0) knee += ln(P(0, 70, p), P(0, 110, p), .9);
    if ([.14, .28, .41].includes(p)) {                                            // collar tie across the roof
      knee += pg('#fff', P(45.5, 40, p), P(154.5, 40, p), P(154.5, 47, p), P(45.5, 47, p)) + ln(P(45.5, 43.5, p), P(154.5, 43.5, p), .25, '#000', '5 2') + pg('url(#d50)', P(45.5, 45, p), P(154.5, 45, p), P(154.5, 47, p), P(45.5, 47, p));
    }
    knee += pg('#fff', P(0, 70, p), P(100, 4, p), P(100, 14, p), P(0, 80, p)) + pg('url(#d50)', P(0, 76, p), P(100, 10, p), P(100, 14, p), P(0, 80, p)) +
      ln(P(0, 73, p), P(100, 7, p), .25, '#000', '8 2 3 3');                          // rafter with a shaded lower edge and grain
    [10, 40, 70].forEach(x => { const c = P(x, 70 - .66 * x + 4, p); knee += `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${(.7 * K * (1 - p) + .15).toFixed(2)}" fill="#000" stroke="none"/>`; });   // nails
  });
  // ----- rough pine floor: boards of different widths and tones, dark gaps, staggered end joints, knots, splinters and nail heads -----
  const xs = [0, 18, 41, 63, 80, 102, 118, 140, 161, 181, 200];
  let floor = '';
  for (let j = 0; j < xs.length - 1; j++) {
    floor += pg(woods[(j * 5 + 2) % 7], [xs[j], 110], [xs[j + 1], 110], P(xs[j + 1], 110, FAR), P(xs[j], 110, FAR)) + ln([xs[j], 110], P(xs[j], 110, FAR), 1.1);
    const g = (xs[j] + xs[j + 1]) / 2;
    floor += ln([g - 3, 110], P(g - 3, 110, FAR), .25, '#000', '9 2 4 3') + ln([g + 3, 110], P(g + 3, 110, FAR), .2, '#000', '5 4 11 2');
  }
  floor += ln([200, 110], P(200, 110, FAR), 1.1);
  [.2, .26, .32, .37, .42, .46, .49].forEach((p, k) => { for (let j = 0; j < xs.length - 1; j++) if ((j * 2 + k) % 3 === 0) {
    const a = P(xs[j], 110, p), b = P(xs[j + 1], 110, p);
    floor += ln(a, b, .6) + `<circle cx="${(a[0] + 2 * (1 - p)).toFixed(1)}" cy="${(a[1] - .8).toFixed(1)}" r=".5" fill="#000" stroke="none"/><circle cx="${(b[0] - 2 * (1 - p)).toFixed(1)}" cy="${(b[1] - .8).toFixed(1)}" r=".5" fill="#000" stroke="none"/>`; } });
  [[30, .22], [90, .27], [150, .33], [110, .4], [60, .36], [170, .45]].forEach(([x, p], i) => { const c = P(x, 110, p), s = K * (1 - p);
    floor += `<ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(4.2 * s).toFixed(1)}" ry="${(1.8 * s).toFixed(1)}" fill="url(#d50)" stroke-width=".4"/><ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(2 * s).toFixed(1)}" ry="${(.8 * s).toFixed(1)}" fill="#000" stroke="none"/>`; });
  // ----- objects: a steamer trunk in the far left corner, a stack of boxes in the far right corner -----
  const trunk = (() => { const S2 = K * (1 - .27), x0 = 8, x1 = 78, p0 = .27, p1 = .4;
    const dome = (p, q) => `M${mv(P(x0, 84, p))}Q${mv(P(43, 68, p))} ${mv(P(x1, 84, p))}`;
    let t = pg('url(#b14)', P(x1, 110, p0), P(x1, 110, p1), P(x1, 84, p1), P(x1, 84, p0));                                              // right side (shaded)
    t += `<path d="M${mv(P(x0, 110, p0))}L${mv(P(x1, 110, p0))}L${mv(P(x1, 84, p0))}Q${mv(P(43, 68, p0))} ${mv(P(x0, 84, p0))}Z" fill="url(#d75)"/>`; // front: dark leather, domed lid
    t += `<path d="${dome(p0)}L${mv(P(x1, 84, p1))}Q${mv(P(43, 68, p1))} ${mv(P(x0, 84, p1))}Z" fill="url(#b10)"/>`;                      // top of the lid
    for (let x = 20; x < 76; x += 11) t += ln(P(x, 76 + Math.abs(x - 43) * .12, p0), P(x, 76 + Math.abs(x - 43) * .12, p1), .35, '#fff', '3 2');        // slats along the lid
    t += ln(P(x0, 92, p0), P(x1, 92, p0), .7, '#fff') + ln(P(x1, 92, p0), P(x1, 92, p1), .7, '#fff') + ln(P(x0 + 3, 106, p0), P(x1 - 3, 106, p0), .35, '#fff', '2 1.5') + ln(P(x0 + 3, 95, p0), P(x1 - 3, 95, p0), .35, '#fff', '2 1.5');   // seam and stitching
    [[14, 100], [30, 88], [54, 104], [70, 98], [24, 108], [60, 86]].forEach(([x, y]) => { const c = P(x, y, p0); t += `<path d="M${mv(c)}l${(3 * S2).toFixed(1)} ${(-1.2 * S2).toFixed(1)}" stroke="#fff" stroke-width=".3" fill="none"/>`; });   // scuffs in the leather                                                   // where lid meets body
    [18, 43, 68].forEach(x => { t += pg('#fff', P(x - 3, 110, p0), P(x + 3, 110, p0), P(x + 3, 80, p0), P(x - 3, 80, p0)); [86, 100, 106].forEach(y => { const c = P(x, y, p0); t += `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r=".55" fill="#000" stroke="none"/>`; }); });  // metal straps with rivets
    const l = P(43, 96, p0); t += `<rect x="${(l[0] - 3).toFixed(1)}" y="${(l[1] - 2).toFixed(1)}" width="6" height="5" fill="#fff" stroke-width=".5"/><circle cx="${l[0].toFixed(1)}" cy="${(l[1] + .4).toFixed(1)}" r=".8" fill="#000" stroke="none"/>`;     // brass latch and keyhole
    [[x0, 110], [x1, 110]].forEach(([x, y], i) => { const c = P(x, y, p0), d = i ? -1 : 1; t += `<path d="M${c[0]} ${c[1]}h${3.4 * d}M${c[0]} ${c[1]}v-3.6" stroke="#fff" stroke-width="1.4" fill="none"/>`; });  // corner brackets
    const h = P(x1, 98, (p0 + p1) / 2); t += `<path d="M${(h[0] - 2.4).toFixed(1)} ${h[1].toFixed(1)}q2.4-4 4.8 0" fill="none" stroke="#fff" stroke-width=".8"/>`;                                    // leather handle
    return t; })();
  const cube = (x0, x1, yTop, p0, p1, tone, tape) => {                               // a cardboard box seen from the center of the room
    const yb = 110, rightSide = (x0 + x1) / 2 < 100, xs = rightSide ? x1 : x0;
    let b = pg('url(#b10)', P(xs, yb, p0), P(xs, yb, p1), P(xs, yTop, p1), P(xs, yTop, p0)) + pg(tone, P(x0, yb, p0), P(x1, yb, p0), P(x1, yTop, p0), P(x0, yTop, p0)) +
      pg('url(#b4)', P(x0, yTop, p0), P(x1, yTop, p0), P(x1, yTop, p1), P(x0, yTop, p1));
    const m = (x0 + x1) / 2;
    b += ln(P(m, yTop, p0), P(m, yTop, p1), .5) + ln(P(x0, yTop, (p0 + p1) / 2), P(x1, yTop, (p0 + p1) / 2), .3);                     // flaps
    if (tape) b += pg('url(#b2)', P(m - 4, yb, p0), P(m + 4, yb, p0), P(m + 4, yTop, p0), P(m - 4, yTop, p0));                                // tape

    const boxes = cube(6, 48, 0, 30, .33, .45, 'url(#b4)', true) + cube(10, 40, 30, 50, .36, .44, 'url(#b2)', false) + cube(52, 80, 0, 18, .36, .46, 'url(#b4)', true) + cube(14, 36, 50, 62, .385, .43, 'url(#b2)', false);
    // ----- darkness: rings of denser dither toward the far wall, which keeps its (dim) light; then a few pale cobwebs and dust -----
    const wallR = [f(0, 0, .5), f(200, 0, .5), f(200, 110, .5), f(0, 110, .5)].map(q => mv(q)).join('L') + 'Z';
    let fog = '';
    [[.08, 'b2'], [.2, 'b4'], [.32, 'b6'], [.42, 'b8']].forEach(([p, id]) => fog += `<path d="M${[f(0, 0, p), f(200, 0, p), f(200, 110, p), f(0, 110, p)].map(q => mv(q)).join('L')}ZM${wallR}" fill-rule="evenodd" fill="url(#${id})" stroke="none"/>`);
    const webs = `<g stroke="#fff">${[[51, 26, 1, 1], [149, 26, -1, 1], [51, 79, 1, -1]].map(([x, y, sx, sy]) => `<path d="M${x} ${y}l${14 * sx} ${5 * sy}M${x} ${y}l${9 * sx} ${10 * sy}M${x} ${y}l${3 * sx} ${14 * sy}M${x + 6 * sx} ${y + 2 * sy}q-1 ${5 * sy} ${-4 * sx} ${6 * sy}M${x + 10 * sx} ${y + 4 * sy}q-1 ${8 * sy} ${-7 * sx} ${9 * sy}" fill="none" stroke-width=".35"/>`).join('')}</g>`;
    let dust = ''; for (let i = 0; i < 14; i++) dust += `<circle cx="${f1(40 + sn(i, 11) * 120)}" cy="${f1(30 + sn(i, 12) * 50)}" r="${(.25 + sn(i, 13) * .25).toFixed(2)}" fill="#fff" stroke="none"/>`;
    return pic(room('url(#d75)', 'url(#d75)', 'url(#d75)', false) + ceiling + `<g>${back}</g>` + stoneWall(1) + mirror(stoneWall(2)) + dirt + door + sh + boxes + fog + webs + dust);
  })(),
  storage: closetPic(true),
  // Back Yard: a peaceful landscape at sunset - gentle rolling hills, a forest in the distance, the sun setting behind the ridge in a glowing sky with
  // wispy clouds and a few stars coming out, and a pumpkin patch in the foreground with big pumpkins sitting in the long grass.
  backyard: (() => {
    const sn = (k, seed = 0) => Math.abs(Math.sin(k * 12.9898 + seed * 78.233)), f1 = n => n.toFixed(1);
    const ridge = (base, a1, w1, a2, w2, ph) => x => base + a1 * Math.sin(x * w1 + ph) + a2 * Math.sin(x * w2 + ph * 2.3);        // gentle rolling hill line
    const far = ridge(61, 2.6, .05, 1.4, .13, 1), mid = ridge(69, 3.6, .035, 1.8, .09, .5), near = ridge(78, 3, .03, 1.6, .08, 2);
    const hill = (fn, bottom) => { let d = `M0 ${f1(fn(0))}`; for (let x = 4; x <= 200; x += 4) d += `L${x} ${f1(fn(x))}`; return d + `L200 ${bottom}L0 ${bottom}Z`; };
    const topline = fn => { let d = `M0 ${f1(fn(0))}`; for (let x = 4; x <= 200; x += 4) d += `L${x} ${f1(fn(x))}`; return d; };
    // ----- sky: bands that lighten toward the horizon, then a glow of nested ellipses around the setting sun (each is erased with white first) -----
    let sky = '';
    [[0,10,'b10'],[10,18,'b8'],[18,26,'b6'],[26,34,'b4'],[34,42,'b2'],[42,50,'d12']].forEach(([y0, y1, id]) => sky += `<rect x="0" y="${y0}" width="200" height="${y1 - y0}" fill="url(#${id})" stroke="none"/>`);
    [[78,'b6'],[62,'b4'],[48,'b2'],[34,'d12'],[22,'']].forEach(([rx, id]) => sky += `<ellipse cx="135" cy="58" rx="${rx}" ry="${f1(rx * .42)}" fill="#fff" stroke="none"/>` + (id ? `<ellipse cx="135" cy="58" rx="${rx}" ry="${f1(rx * .42)}" fill="url(#${id})" stroke="none"/>` : ''));
    // stars coming out in the dark upper sky (a few with little sparkles)
    sky += [[14,6],[38,12],[62,5],[88,13],[110,4],[150,7],[176,11],[190,5],[26,20],[72,22],[168,21]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".6" fill="#fff" stroke="none"/>`).join('') +
      `<path d="M38 9.4v5.2M35.4 12h5.2M62 2.6v4.8M59.6 5h4.8M176 8.4v5.2M173.4 11h5.2" stroke="#fff" stroke-width=".35"/>`;
    // wispy clouds: long tapered cloud shapes with a shaded underside, streaky wisps and trailing threads
    const cloud = (x, y, w, h) => `<path d="M${x} ${y}Q${x + w * .1} ${y - h * .7} ${x + w * .3} ${y - h * .5}Q${x + w * .45} ${y - h} ${x + w * .6} ${y - h * .5}Q${x + w * .8} ${y - h * .6} ${x + w} ${y}Q${x + w * .6} ${y + h * .35} ${x} ${y}Z" fill="#fff" stroke-width=".5"/>` +
      `<path d="M${x + w * .08} ${y}Q${x + w * .5} ${y + h * .3} ${x + w * .96} ${y}Q${x + w * .5} ${y + h * .12} ${x + w * .08} ${y}Z" fill="url(#b6)" stroke="none"/><path d="M${x - w * .12} ${y + h * .25}H${x + w * .3}M${x + w * .7} ${y + h * .22}H${x + w * 1.14}M${x + w * .2} ${y - h * .2}H${x + w * .5}" fill="none" stroke-width=".3"/>`;
    sky += cloud(10, 30, 46, 6) + cloud(70, 24, 38, 4.4) + cloud(128, 34, 50, 6.4) + cloud(150, 18, 40, 4.4) + cloud(36, 44, 34, 3.6) + cloud(96, 41, 30, 3.2);
    sky += '<path d="M0 36q10-2 22 0M44 27q14-2 30 0M104 29q10 1 22 0M186 28q8-2 14 0M150 42q16-2 34 0" fill="none" stroke-width=".25" stroke-dasharray="4 2"/>';
    // the sun, half hidden behind the far ridge, with hazy streaks across it
    const sun = `<circle cx="135" cy="59" r="8.5" fill="#fff" stroke-width=".6"/><path d="M127.4 56h15.2M127 58.6h16M127.6 61h14.8" stroke-width=".3" stroke-dasharray="5 1.5"/>`;
    // ----- the three rolling hills, from far to near, with atmospheric mist between them -----
    let land = `<path d="${hill(far, 70)}" fill="url(#b12)"/>`;
    for (let x = 0; x < 200; x += 2.1) { const h = 4 + sn(x, 1) * 5, y = far(x) + 1;                                                     // the distant forest: a ridge of pointed trees
      land += sn(x, 2) > .72 ? `<circle cx="${f1(x)}" cy="${f1(y - h * .6)}" r="${f1(h * .55)}" fill="#000" stroke="none"/>` : `<path d="M${f1(x - 1.4)} ${f1(y)}L${f1(x)} ${f1(y - h)}L${f1(x + 1.4)} ${f1(y)}Z" fill="#000" stroke="none"/>`; }

      `<path d="M0 68Q50 64 100 67T200 66V72H0Z" fill="#fff" stroke="none"/><path d="M0 68Q50 64 100 67T200 66V72H0Z" fill="url(#b4)" stroke="none"/>` +                       // mist in the valley
      `<path d="${hill(mid, 82)}" fill="#fff"/><path d="${hill(mid, 82)}" fill="url(#b10)"/><path d="${topline(mid)}" fill="none" stroke="#fff" stroke-width=".4" stroke-dasharray="3 3"/>`;                      // middle hill with a rim of light
    [[26, 8], [34, 6], [58, 7], [172, 9], [182, 6], [160, 5]].forEach(([x, r], i) => { const y = mid(x) + 1;                                                 // clumps of round trees
      land += `<rect x="${x - .8}" y="${f1(y - r * .6)}" width="1.6" height="${f1(r * .7)}" fill="#000" stroke="none"/><circle cx="${x}" cy="${f1(y - r * 1.1)}" r="${r}" fill="#000" stroke="none"/><circle cx="${x + r * .5}" cy="${f1(y - r * .8)}" r="${f1(r * .7)}" fill="#000" stroke="none"/><path d="M${f1(x + r * .7)} ${f1(y - r * 1.9)}Q${f1(x + r * 1.2)} ${f1(y - r * 1.1)} ${f1(x + r * .9)} ${f1(y - r * .4)}" fill="none" stroke="#fff" stroke-width=".35"/>`; });
    land += `<path d="${hill(near, 92)}" fill="#fff"/><path d="${hill(near, 92)}" fill="url(#b6)"/><path d="${topline(near)}" fill="none" stroke="#000" stroke-width=".5"/>`;                       // nearest hill
    for (let i = 0; i < 9; i++) { const x0 = i * 24 - 6; land += `<path d="M${x0} ${f1(near(x0) + 6 + (i % 3) * 4)}Q${x0 + 14} ${f1(near(x0 + 14) + 3 + (i % 3) * 4)} ${x0 + 30} ${f1(near(x0 + 30) + 6 + (i % 3) * 4)}" fill="none" stroke="#000" stroke-width=".25" stroke-dasharray="3 3"/>`; }     // furrows following the slope
    land += `<rect y="86" width="200" height="24" fill="#fff" stroke="none"/><rect y="86" width="200" height="24" fill="url(#b4)" stroke="none"/><rect y="98" width="200" height="12" fill="url(#b6)" stroke="none"/>`;
    for (let i = 0; i < 170; i++) { const x = sn(i, 21) * 200, y = 88 + sn(i, 22) * 16, h = 2.5 + sn(i, 23) * 4 * (y - 84) / 20, lean = (sn(i, 24) - .5) * 5;     // tufts of lawn grass
      land += `<path d="M${f1(x)} ${f1(y)}q${f1(lean / 2)} ${f1(-h / 2)} ${f1(lean)} ${f1(-h)}M${f1(x + 1.2)} ${f1(y)}q${f1(lean / 2 + .4)} ${f1(-h / 2)} ${f1(lean + 1)} ${f1(-h * .8)}" fill="none" stroke="#000" stroke-width=".35"/>`; }
    // ----- the pumpkin patch: vines first, then pumpkins from back to front, each lighter in tone (a little darker on the shadow side) with a rim of sunlight -----
    const leaf = (x, y, s, rot) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M0 0L-3 -2L-4.4 -5L-2.4 -5.4L-1.8 -8.4L0 -7L1.8 -8.4L2.4 -5.4L4.4 -5L3 -2Z" fill="url(#b6)" stroke-width=".5"/><path d="M0 0V-7M0 -2L-2.6 -4M0 -2L2.6 -4M0 -4.6L-1.6 -6M0 -4.6L1.6 -6" stroke-width=".3" fill="none"/></g>`;
    let patch = `<path d="M-4 99Q30 94 60 100T120 96T204 100M18 106Q60 98 96 104" fill="none" stroke="#000" stroke-width=".7"/><path d="M8 96q-3-5 1-6q3 1 1 4M104 92q-2-5 2-5q3 1 .5 4M170 94q4-4 6-1q0 3-3 2" fill="none" stroke="#000" stroke-width=".5"/>` +
      leaf(14, 92, 1.3, -20) + leaf(48, 96, 1.5, 30) + leaf(88, 90, 1.1, -10) + leaf(122, 94, 1.6, 15) + leaf(160, 92, 1.3, -35) + leaf(190, 96, 1.5, 25);
    // pump(): one pumpkin, built like a real one - seven ribbed lobes that bulge out and pinch back to the stem dimple and the base, lit from the right
    // (the sunlit lobes are white, the shadow side is gray), with dark grooves, fine ridges, a glossy highlight, a ribbed stem with a curl, and a cast shadow.
    const pump = (cx, cy, rx, ry, tilt = 0) => {
      const k = rx / 12, T = cy - ry * .9, B = cy + ry * .9;
      const ph = [-90, -64, -39, -13, 13, 39, 64, 90].map(d => d * Math.PI / 180);
      const gt = a => cx + .2 * rx * Math.sin(a), ge = a => cx + rx * Math.sin(a);                                                // where a groove sits at the top/bottom and at the middle
      const groove = a => `M${f1(gt(a))} ${f1(T)}C${f1(ge(a))} ${f1(cy - ry * .55)} ${f1(ge(a))} ${f1(cy + ry * .55)} ${f1(gt(a))} ${f1(B)}`;
      const shade = ['url(#b8)', 'url(#b6)', 'url(#b4)', 'url(#b2)', 'url(#d12)', '#fff', '#fff'];

      let body = `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry * .9)}" fill="#fff" stroke="none"/>`;
      for (let i = 0; i < 7; i++) body += `<path d="M${f1(gt(ph[i]))} ${f1(T)}C${f1(ge(ph[i]))} ${f1(cy - ry * .55)} ${f1(ge(ph[i]))} ${f1(cy + ry * .55)} ${f1(gt(ph[i]))} ${f1(B)}L${f1(gt(ph[i + 1]))} ${f1(B)}C${f1(ge(ph[i + 1]))} ${f1(cy + ry * .55)} ${f1(ge(ph[i + 1]))} ${f1(cy - ry * .55)} ${f1(gt(ph[i + 1]))} ${f1(T)}Z" fill="${shade[i]}" stroke="none"/>`;
      for (let i = 1; i < 7; i++) body += `<path d="${groove(ph[i])}" fill="none" stroke="url(#b10)" stroke-width="${f1(1.5 * k + .3)}"/><path d="${groove(ph[i])}" fill="none" stroke="#000" stroke-width="${f1(.3 + k * .12)}"/>`;          // deep grooves between the lobes
      [-77, -51.5, -26, 0, 26, 51.5, 77].forEach(d => body += `<path d="${groove(d * Math.PI / 180)}" fill="none" stroke="#000" stroke-width=".2" stroke-dasharray="2 3"/>`);                                             // fine ridges along each lobe
      body += `<path d="${groove(ph[0])}M${f1(gt(ph[7]))} ${f1(T)}" fill="none" stroke="#000" stroke-width="${f1(.5 + k * .2)}"/><path d="${groove(ph[7])}" fill="none" stroke="#000" stroke-width="${f1(.5 + k * .2)}"/>`;      // outline
      body += `<path d="M${f1(cx - rx * .92)} ${f1(cy + ry * .3)}Q${f1(cx)} ${f1(cy + ry * 1.16)} ${f1(cx + rx * .92)} ${f1(cy + ry * .3)}Q${f1(cx)} ${f1(cy + ry * .8)} ${f1(cx - rx * .92)} ${f1(cy + ry * .3)}Z" fill="url(#b8)" stroke="none"/>`;   // underside shading
      body += `<ellipse cx="${f1(cx + rx * .44)}" cy="${f1(cy - ry * .3)}" rx="${f1(rx * .1)}" ry="${f1(ry * .27)}" fill="#fff" stroke="none" transform="rotate(14 ${f1(cx + rx * .44)} ${f1(cy - ry * .3)})"/><circle cx="${f1(cx + rx * .47)}" cy="${f1(cy - ry * .5)}" r="${f1(.5 + k * .15)}" fill="#fff" stroke="none"/>` +      // gloss
        `<path d="M${f1(cx + rx * .98)} ${f1(cy - ry * .4)}Q${f1(cx + rx * 1.02)} ${f1(cy + ry * .2)} ${f1(cx + rx * .8)} ${f1(cy + ry * .6)}" fill="none" stroke="#fff" stroke-width="${f1(.5 + k * .2)}"/>` +                                                                                                     // sunlit rim
        `<ellipse cx="${f1(cx)}" cy="${f1(T + ry * .06)}" rx="${f1(rx * .26)}" ry="${f1(ry * .1)}" fill="url(#b8)" stroke="none"/>` +                                                                                                                       // dimple around the stem
        `<g transform="translate(${f1(cx)} ${f1(T + ry * .05)}) scale(${f1(k)})"><path d="M-2.2 0C-2.6 -3 -2 -5.4 -.6 -7C0 -7.6 1.4 -7.8 2.2 -7C2.6 -5.6 2.4 -3 2.6 0Z" fill="url(#d75)" stroke-width=".5"/><path d="M-1 -.4V-6.6M0 -.4V-7.2" stroke="#fff" stroke-width=".2"/><path d="M1.4 -6.6C1.8 -4.4 1.6 -2 1.8 -.4" fill="none" stroke="#fff" stroke-width=".3"/><path d="M-.6 -7.2q2.4 -1.6 4.4 -.2q.8 .6 .4 1.6" fill="none" stroke="#000" stroke-width=".8"/><ellipse cx=".8" cy="-7.3" rx="1.7" ry=".6" fill="url(#b4)" stroke-width=".3"/></g>`;   // ribbed stem with a curl

        patch += `<path d="M${f1(gx)} ${f1(gy)}q${f1(lean / 2)} ${f1(-h / 2)} ${f1(lean)} ${f1(-h)}" fill="none" stroke="#000" stroke-width=".4"/>`; } });

      grass += `<path d="M${f1(x)} ${f1(y)}q${f1(lean / 2)} ${f1(-h / 2)} ${f1(lean)} ${f1(-h)}" fill="none" stroke="#000" stroke-width="${(.3 + sn(i, 11) * .4).toFixed(2)}"/>`;
      if (sn(i, 12) > .86) grass += `<circle cx="${f1(x + lean)}" cy="${f1(y - h)}" r=".8" fill="#000" stroke="none"/>`; }

// Extra details drawn on top of each picture (cobwebs, props, bats...). Edit or add lines here to tweak a scene.
const EXTRA = {
  front: bat(62, 16) + bat(142, 28) + bat(182, 46),
  entry: web(50, 25, 1, 1) + web(150, 25, -1, 1),
  bedroom: '',
  attic: '',
  closet: '',
  parlor: '',
  portrait: '',
  dining: '',
  kitchen: '',
  basement: '',
  storage: '',
  backyard: ''
};
Object.keys(EXTRA).forEach(k => { ART[k] = ART[k].replace('</g></svg>', EXTRA[k] + '</g></svg>'); });

/* ---------- GAME LOGIC ---------- */
// state remembers whether the bats have already flown out (and whether they are flying right now)
let state = { current: 'front', batsSeen: false, batsNow: false };
let currentChoices = [];  // the choices on screen, used by the number-key shortcuts

// Move to a scene: update state, play sounds, then draw it.
function go(id, snd, reset) {
  if (reset) state = { current: 'front', batsSeen: false, batsNow: false };  // Play again wipes everything
  state.batsNow = false;
  if (id === 'attic' && !state.batsSeen) {      // first time only: bats!
    state.batsSeen = true; state.batsNow = true;
    SOUNDS.squeak();
  }
  if (snd) SOUNDS[snd]();
  state.current = id;
  const scene = SCENES[id];
  if (scene.onEnter) SOUNDS[scene.onEnter]();
  render(scene);
}

// Draw the current scene: picture, title, story text, and one button per choice.
function render(scene) {
  const artKey = typeof scene.art === 'function' ? scene.art() : scene.art;      // some scenes (the attic) pick their picture as the game goes
  document.getElementById('art').innerHTML = ART[artKey];
  document.getElementById('art').setAttribute('aria-label', 'Illustration: ' + scene.title);
  const title = document.getElementById('title');
  title.textContent = scene.title;
  const story = document.getElementById('story');
  story.innerHTML = '';
  scene.text().forEach(line => { const p = document.createElement('p'); p.textContent = line; story.appendChild(p); });
  if (scene.end) { const e = document.createElement('div'); e.className = 'end'; e.textContent = 'THE END'; story.appendChild(e); }
  const list = document.getElementById('choices');
  list.innerHTML = '';
  currentChoices = scene.choices;
  scene.choices.forEach((c, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + c.label;
    b.addEventListener('click', () => go(c.to, c.snd, c.reset));
    li.appendChild(b); list.appendChild(li);
  });
  title.focus({ preventScroll: false });   // move keyboard/screen reader focus to the new scene
}

// Number keys 1-9 pick the matching choice.
document.addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= currentChoices.length && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const c = currentChoices[n - 1]; go(c.to, c.snd, c.reset);
  }
});

// Sound on/off button
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
  soundBtn.setAttribute('aria-pressed', String(soundOn));
});

// Start the game
render(SCENES.front);
</script>
