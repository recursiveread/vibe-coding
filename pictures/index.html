<!DOCTYPE html>
<!-- v1.3 - single-file image slider, wraparound nav, keyboard accessible, photo list drives filenames/captions/descriptions, caption sits below picture, full caption list shown under slider -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Slider</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #1c1b1a;
    --surface: #262422;
    --ink: #f2ede6;
    --ink-dim: #a89f93;
    --accent: #c98a3e;
    --ring: #e0b578;
    --radius: 14px;
    --gap: 1.5rem;
  }

  /* ---------- Reset basics ---------- */
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    padding: 2rem 1rem;
  }

  /* Respect users who prefer less motion */
  @media (prefers-reduced-motion: reduce) {
    * {
      transition-duration: 0.01ms !important;
    }
  }

  /* ---------- Slider shell ---------- */
  .slider {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .slider__heading {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }

  /* The stage holds one card at a time; buttons sit either side of it */
  .slider__stage {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
  }

  /* ---------- Card wrapper: groups the picture with its caption below it ---------- */
  .card-wrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    min-width: 0;
  }

  /* ---------- Card (the picture itself) ---------- */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    /* Fixed aspect ratio keeps every photo displayed at the same size,
       regardless of the original image file's dimensions. */
    aspect-ratio: 4 / 5;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  }

  .card img {
    width: 100%;
    height: 100%;
    /* object-fit: cover crops each photo to fill the fixed box uniformly,
       so a portrait phone photo and a wide landscape photo end up the
       same on-screen size. */
    object-fit: cover;
    display: block;
  }

  /* Caption sits as normal text underneath the picture, not on top of it */
  .card__caption {
    margin: 0;
    text-align: center;
    padding: 0 0.5rem;
    font-size: 0.85rem;
    color: var(--ink-dim);
  }

  /* ---------- Prev / Next buttons ---------- */
  .nav-btn {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(242, 237, 230, 0.25);
    background: var(--surface);
    color: var(--ink);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 150ms ease, transform 150ms ease;
  }

  .nav-btn:hover {
    background: #33302c;
  }

  .nav-btn:active {
    transform: scale(0.92);
  }

  /* Clear visible focus ring for keyboard users */
  .nav-btn:focus-visible,
  .dot:focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }

  /* ---------- Position dots ---------- */
  .slider__dots {
    display: flex;
    gap: 0.5rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: rgba(242, 237, 230, 0.3);
    cursor: pointer;
  }

  .dot[aria-current="true"] {
    background: var(--accent);
  }

  /* ---------- Caption list (shows every caption at once) ---------- */
  .caption-list-wrap {
    width: 100%;
    max-width: 520px;
    margin-top: 2rem;
  }

  .caption-list__heading {
    margin: 0 0 0.75rem;
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--ink-dim);
  }

  .caption-list {
    margin: 0;
    padding-left: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .caption-list li {
    font-size: 0.9rem;
    color: var(--ink);
  }

  .caption-list li[aria-current="true"] {
    color: var(--accent);
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 380px) {
    .nav-btn {
      width: 38px;
      height: 38px;
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

  <!--
    Structure notes for screen reader / keyboard users:
    - The whole widget is a "region" landmark labelled "Photo slider".
    - role="group" + aria-roledescription="slide" on each card tells
      assistive tech this behaves like a carousel slide, not a plain list item.
    - A visually hidden live region announces "Photo X of 5" whenever the
      slide changes, so non-visual users know their position.
    - Prev/Next are real <button> elements, so they are keyboard-focusable
      and activate with both Enter and Space automatically.
  -->
  <section class="slider" aria-label="Photo slider">
    <h1 class="slider__heading">Photo Gallery</h1>

    <div class="slider__stage">
      <button type="button" class="nav-btn" id="prevBtn" aria-label="Previous photo">&#8249;</button>

      <div class="card-wrap">
        <div class="card" role="group" aria-roledescription="slide" id="cardContainer" aria-label="Photo 1 of 5">
          <img id="cardImage" src="photo-1.jpg" alt="Gallery photo 1" width="800" height="1000">
        </div>
        <p class="card__caption" id="cardCaption">1 of 5</p>
      </div>

      <button type="button" class="nav-btn" id="nextBtn" aria-label="Next photo">&#8250;</button>
    </div>

    <!-- Dots let the user jump straight to a given card as an alternative to Prev/Next -->
    <ul class="slider__dots" id="dots" role="tablist" aria-label="Choose photo"></ul>
  </section>

  <!-- A plain list of every caption, so someone can see them all at once
       without stepping through the slider one card at a time -->
  <section class="caption-list-wrap" aria-label="All captions">
    <h2 class="caption-list__heading">All captions</h2>
    <ol class="caption-list" id="captionList"></ol>
  </section>

  <!-- Visually hidden but screen-reader announced status of the current slide -->
  <div id="liveStatus" aria-live="polite" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;"></div>

  <script>
    // v1.3 - added a plain list under the slider showing every caption at once

    // ============================================================
    // PHOTO LIST — the only thing you need to edit to change photos.
    //
    // Each entry is one card:
    //   file        - the image file name, sitting in the same folder as this page
    //   caption     - short text shown under the picture, visible to everyone
    //   description - a proper description of what's in the picture, read aloud
    //                  by screen readers for people who can't see it (this
    //                  becomes the image's "alt text")
    //
    // To add a picture: drop the new image file in the folder, then add one
    // more { file, caption, description } entry below. Nothing else in this
    // file needs to change — the number of cards, the dots, and the
    // Prev/Next wraparound all follow this list automatically.
    // ============================================================
    var PHOTOS = [
      { file: 'photo-1.jpg', caption: 'Snuggle time', description: 'Gallery photo 1' },
      { file: 'photo-2.jpg', caption: 'More naps', description: 'Gallery photo 2' },
      { file: 'photo-3.jpg', caption: 'Maynard in his favorite napping spot', description: 'Gallery photo 3' },
      { file: 'photo-4.jpg', caption: 'Maureen demands dinner', description: 'Gallery photo 4' },
      { file: 'photo-5.jpg', caption: 'Maynard hogs all the pillows', description: 'Gallery photo 5' },
      { file: 'photo-6.jpg', caption: 'Maureen is not quite awake', description: 'Gallery photo 6' }
    ];

    // ---- Total number of cards/photos in the slider, taken from the list above ----
    var TOTAL_CARDS = PHOTOS.length;

    // ---- Track which card is currently showing (0-based index) ----
    var currentIndex = 0;

    // ---- Grab the DOM elements we need to update whenever the slide changes ----
    var cardContainer = document.getElementById('cardContainer');
    var cardImage = document.getElementById('cardImage');
    var cardCaption = document.getElementById('cardCaption');
    var liveStatus = document.getElementById('liveStatus');
    var dotsList = document.getElementById('dots');
    var captionList = document.getElementById('captionList');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');

    // ---- Build the row of dots (one per card) so users can jump directly to a slide ----
    // Each dot is a real button with its own label, and aria-current marks the active one.
    for (var i = 0; i < TOTAL_CARDS; i++) {
      var dot = document.createElement('li');
      var dotBtn = document.createElement('button');
      dotBtn.className = 'dot';
      dotBtn.type = 'button';
      dotBtn.setAttribute('role', 'tab');
      dotBtn.setAttribute('aria-label', 'Go to photo ' + (i + 1));
      dotBtn.dataset.index = i;
      dot.appendChild(dotBtn);
      dotsList.appendChild(dot);
    }
    // Collect the dot buttons now that they exist, so we can update/style them later
    var dotButtons = dotsList.querySelectorAll('.dot');

    // ---- Build the plain list of every caption, so all of them are visible at once ----
    for (var k = 0; k < TOTAL_CARDS; k++) {
      var captionItem = document.createElement('li');
      captionItem.textContent = PHOTOS[k].caption;
      captionList.appendChild(captionItem);
    }
    // Collect the caption list items now that they exist, so we can highlight the active one later
    var captionItems = captionList.querySelectorAll('li');

    // ---- Core function: update every part of the page to reflect currentIndex ----
    function renderSlide() {
      // Look up this slide's file name, caption, and description from the
      // single PHOTOS list at the top of this script.
      var photo = PHOTOS[currentIndex];
      var photoNumber = currentIndex + 1;

      // Swap the image source and its descriptive alt text (for people
      // who can't see the picture)
      cardImage.src = photo.file;
      cardImage.alt = photo.description;

      // Update the visible caption shown under the picture
      cardCaption.textContent = photo.caption;

      // Update the card's accessible label so screen readers announce the position
      cardContainer.setAttribute('aria-label', 'Photo ' + photoNumber + ' of ' + TOTAL_CARDS);

      // Announce the change to screen reader users via the live region
      liveStatus.textContent = 'Showing photo ' + photoNumber + ' of ' + TOTAL_CARDS + ': ' + photo.description;

      // Highlight the matching dot and un-highlight the rest
      for (var i = 0; i < dotButtons.length; i++) {
        var isActive = (i === currentIndex);
        dotButtons[i].setAttribute('aria-current', isActive ? 'true' : 'false');
        dotButtons[i].setAttribute('aria-selected', isActive ? 'true' : 'false');
      }

      // Highlight the matching entry in the full caption list below the slider
      for (var m = 0; m < captionItems.length; m++) {
        captionItems[m].setAttribute('aria-current', (m === currentIndex) ? 'true' : 'false');
      }
    }

    // ---- Move to the next card, wrapping from the last card back to the first ----
    function goNext() {
      // The % (modulo) operator wraps the index back to 0 once it would
      // otherwise go past the last card (TOTAL_CARDS - 1).
      currentIndex = (currentIndex + 1) % TOTAL_CARDS;
      renderSlide();
    }

    // ---- Move to the previous card, wrapping from the first card to the last ----
    function goPrev() {
      // Adding TOTAL_CARDS before the modulo avoids a negative result in
      // JavaScript when currentIndex is 0 and we subtract 1.
      currentIndex = (currentIndex - 1 + TOTAL_CARDS) % TOTAL_CARDS;
      renderSlide();
    }

    // ---- Wire up the Prev / Next buttons ----
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    // ---- Wire up the dots so clicking one jumps straight to that card ----
    for (var j = 0; j < dotButtons.length; j++) {
      dotButtons[j].addEventListener('click', function (event) {
        currentIndex = parseInt(event.currentTarget.dataset.index, 10);
        renderSlide();
      });
    }

    // ---- Keyboard support: Left/Right arrow keys move between cards ----
    // This works anywhere on the page, so keyboard users don't have to
    // tab focus onto a specific button first.
    document.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowRight') {
        goNext();
      } else if (event.key === 'ArrowLeft') {
        goPrev();
      }
    });

    // ---- Basic touch swipe support for phones/tablets ----
    var touchStartX = null;
    cardContainer.addEventListener('touchstart', function (event) {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    cardContainer.addEventListener('touchend', function (event) {
      if (touchStartX === null) return;
      var touchEndX = event.changedTouches[0].clientX;
      var deltaX = touchEndX - touchStartX;
      var SWIPE_THRESHOLD = 40; // minimum pixels to count as an intentional swipe

      if (deltaX > SWIPE_THRESHOLD) {
        goPrev(); // swiped right -> go to previous card
      } else if (deltaX < -SWIPE_THRESHOLD) {
        goNext(); // swiped left -> go to next card
      }
      touchStartX = null;
    }, { passive: true });

    // ---- Paint the very first slide on page load ----
    renderSlide();
  </script>
</body>
</html>
