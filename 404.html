<!DOCTYPE html>
<!-- v1.2 - light beige theme with watercolor washes; heading now "Whoops!"; added watercolor hobby page link -->
<!-- v1.1 - removed the big number from the page; added a soft magnifier icon -->
<!-- v1.0 - initial build: friendly page-not-found page, single file, no external requests -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whoops! Page not found</title>
  <meta name="description" content="Whoops! We couldn't find that page. Head back home or visit my watercolor painting page.">
  <meta name="robots" content="noindex">
  <style>
    /* v1.2 - colour tokens: light beige paper, warm ink, dusty-blue main button */
    :root {
      --bg: #f3ece0;
      --panel: rgba(251, 247, 240, 0.86);
      --text: #3a3630;
      --muted: #655e53;
      --accent: #4a6f8a;          /* main button (white text = ~5:1 contrast) */
      --accent-hover: #3b5b73;
      --accent-text: #ffffff;
      --outline: #7d7264;         /* border on the secondary link */
      --icon: #9db8c9;            /* soft blue-grey magnifier */
      --focus: #1d4ed8;

      /* Watercolor wash colours (decorative only) */
      --wash-blue: rgba(126, 170, 199, 0.55);
      --wash-rose: rgba(224, 150, 160, 0.48);
      --wash-sage: rgba(157, 190, 158, 0.55);
      --wash-gold: rgba(232, 200, 120, 0.5);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    /* Watercolor washes: soft, blurred colour blobs behind the card.
       They are purely decorative and hidden from assistive technology. */
    .washes { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .wash {
      position: absolute;
      filter: blur(38px);
      border-radius: 58% 42% 63% 37% / 46% 55% 45% 54%;
    }
    .wash.blue { width: 46vmax; height: 38vmax; top: -12vmax; left: -10vmax; background: var(--wash-blue); }
    .wash.rose { width: 34vmax; height: 30vmax; bottom: -10vmax; left: 6vmax; background: var(--wash-rose); transform: rotate(20deg); }
    .wash.sage { width: 40vmax; height: 32vmax; bottom: -12vmax; right: -10vmax; background: var(--wash-sage); transform: rotate(-15deg); }
    .wash.gold { width: 24vmax; height: 20vmax; top: 6vmax; right: 4vmax; background: var(--wash-gold); transform: rotate(35deg); }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 34rem;
      padding: clamp(2rem, 6vw, 3.5rem) clamp(1.5rem, 5vw, 3rem);
      background: var(--panel);
      border-radius: 1.5rem;
      text-align: center;
    }

    .icon {
      width: clamp(4.5rem, 20vw, 6rem);
      height: auto;
      margin: 0 auto 0.5rem;
      display: block;
      color: var(--icon);
    }

    h1 {
      margin: 0.25rem 0 0.75rem;
      font-size: clamp(2.2rem, 8vw, 3rem);
      line-height: 1.15;
    }

    p { margin: 0 0 1.5rem; color: var(--muted); font-size: 1.1rem; }

    /* Shows which address was requested; hidden until JavaScript fills it in */
    .requested { margin: -0.5rem 0 1.5rem; font-size: 0.95rem; overflow-wrap: anywhere; }
    .requested[hidden] { display: none; }
    .requested code {
      padding: 0.1rem 0.4rem;
      border-radius: 0.4rem;
      background: rgba(125, 114, 100, 0.14);
      color: var(--text);
    }

    /* Main action: big, high contrast, easy to tap */
    .home-link {
      display: inline-block;
      padding: 1rem 2rem;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 1.2rem;
      font-weight: 700;
      text-decoration: none;
    }
    .home-link:hover { background: var(--accent-hover); }

    /* Alternative suggestion: the watercolor hobby page */
    .alt { margin: 2rem 0 0; padding-top: 1.5rem; border-top: 1px solid rgba(125, 114, 100, 0.3); }
    .alt p { margin-bottom: 1rem; font-size: 1.05rem; }
    .alt-link {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: 2px solid var(--outline);
      border-radius: 999px;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
    }
    .alt-link:hover { background: rgba(125, 114, 100, 0.14); }

    /* Clear keyboard focus ring for every interactive element */
    a:focus-visible, button:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

    /* Tertiary action: plain text button */
    .back {
      display: block;
      margin: 1.25rem auto 0;
      padding: 0.5rem 1rem;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 1rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .back:hover { color: var(--text); }
    .back[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- Decorative watercolor washes, hidden from screen readers -->
  <div class="washes" aria-hidden="true">
    <div class="wash blue"></div>
    <div class="wash rose"></div>
    <div class="wash sage"></div>
    <div class="wash gold"></div>
  </div>

  <main aria-labelledby="title">
    <svg class="icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" aria-hidden="true" focusable="false">
      <circle cx="42" cy="42" r="26"/>
      <line x1="61" y1="61" x2="86" y2="86"/>
    </svg>
    <h1 id="title">Whoops!</h1>
    <p>We can't find that page. It may have moved, or the link may have a typo.</p>

    <!-- Filled in by the script below; stays hidden if the address can't be read -->
    <p class="requested" id="requested" hidden>You asked for: <code id="requested-path"></code></p>

    <a class="home-link" href="https://recursiveread.github.io/vibe-coding/">Go to the home page</a>

    <section class="alt" aria-labelledby="alt-title">
      <p id="alt-title">Or, while you're here, check out my page about watercolor painting.</p>
      <a class="alt-link" href="https://recursiveread.github.io/vibe-coding/my-page/">See my watercolor page</a>
    </section>

    <!-- Only shown when there is a page to go back to -->
    <button class="back" id="back" type="button" hidden>Or go back to the previous page</button>
  </main>

  <script>
    // v1.2 - unchanged logic; comments kept in plain language
    // Wrapped in a function so our variables don't leak into the page's global space.
    (function () {
      'use strict';

      // BLOCK 1: Show the address the visitor asked for.
      // We read the path from the browser's address bar (nothing is sent anywhere)
      // and place it on the page as plain text. Using textContent means any odd
      // characters in the address can never be treated as code.
      var requestedBox = document.getElementById('requested');
      var requestedPath = document.getElementById('requested-path');
      try {
        var path = window.location.pathname;
        if (requestedBox && requestedPath && path && path !== '/') {
          requestedPath.textContent = path;
          requestedBox.hidden = false; // reveal the line now that it has content
        }
      } catch (e) {
        // If the address can't be read, we simply leave the line hidden.
      }

      // BLOCK 2: Set up the "go back" button.
      // The browser keeps a list of pages the visitor has seen. If that list has
      // more than one entry, there is somewhere to go back to, so we show the
      // button and make it step back one page when clicked or activated by keyboard.
      var backButton = document.getElementById('back');
      if (backButton && window.history.length > 1) {
        backButton.hidden = false;
        backButton.addEventListener('click', function () {
          window.history.back();
        });
      }
    })();
  </script>
</body>
</html>
